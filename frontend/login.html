<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172554">
    <title>Login | Customer Insights</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 38px;
            border-radius: 20px;
            border: 1px solid #e8edf5;
            box-shadow: 0 12px 35px rgba(23, 37, 84, 0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: auto auto 16px;
            display: grid;
            place-items: center;
            background: #172554;
            color: white;
            border-radius: 16px;
            font-size: 27px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 9px;
            color: #172554;
            font-size: 25px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .password-wrap {
            display: flex;
            gap: 8px;
        }

        .password-wrap input {
            flex: 1;
            min-width: 0;
        }

        .toggle {
            padding: 0 12px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 10px;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #172554;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover { background: #1e40af; }
        .login-button:disabled { opacity: 0.65; cursor: wait; }

        #message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.4;
        }

        #message.error {
            display: block;
            color: #991b1b;
            background: #fef2f2;
        }

        #message.success {
            display: block;
            color: #166534;
            background: #f0fdf4;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .footer a {
            color: #1d4ed8;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-card { padding: 28px 22px; }
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">
            <div class="brand-icon">C</div>
            <h1>Welcome Back</h1>
            <div class="subtitle">
                Sign in to access your Customer Segmentation Dashboard.
            </div>
        </div>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                maxlength="254"
                required
            >

            <label for="password">Password</label>
            <div class="password-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <button class="toggle" type="button" id="togglePassword">
                    Show
                </button>
            </div>

            <button class="login-button" type="submit" id="loginButton">
                Sign In
            </button>

            <div id="message" role="alert" aria-live="polite"></div>
        </form>

        <div class="footer">
            New user?
            <a href="/register">Create an account</a>
        </div>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const showing = passwordInput.type === "text";
            passwordInput.type = showing ? "password" : "text";
            togglePassword.textContent = showing ? "Show" : "Hide";
        });

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            message.className = "";
            message.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: passwordInput.value
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Login failed.");
                }

                message.textContent = "Login successful. Opening dashboard...";
                message.className = "success";

                window.location.replace("/");
            } catch (error) {
                message.textContent = error.message || "Unable to connect. Try again.";
                message.className = "error";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
